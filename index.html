<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الفعاليات</title>
  <meta name="description" content="اكتشف واحجز أجمل الفعاليات الثقافية والترفيهية في السعودية" />
  <meta name="theme-color" content="#0f3d3e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-page="home" class="">
  <header id="site-header"></header>
  <main>
    <section class="hero" style="padding:0" aria-label="Featured events">
      <div id="slides"></div>
      <button class="slide-ctl prev" aria-label="Previous">‹</button>
      <button class="slide-ctl next" aria-label="Next">›</button>
      <div class="dots" role="tablist"></div>
      <button class="pause" aria-label="Pause">⏸</button>
    </section>

    <div class="quick">
      <div class="container">
        <form class="quick-card" id="quick">
          <div class="f"><label for="f-q" data-i18n="q.what"></label><input id="f-q" data-i18n-ph="q.ph" autocomplete="off" /></div>
          <div class="f"><label for="f-city" data-i18n="q.city"></label><select id="f-city"></select></div>
          <div class="f"><label for="f-cat" data-i18n="q.cat"></label><select id="f-cat"></select></div>
          <button class="btn" type="submit" data-i18n="q.go"></button>
        </form>
      </div>
    </div>

    <section>
      <div class="container">
        <div class="sec-head center reveal"><div><span class="k" data-i18n="cats.k"></span><h2 data-i18n="cats.t"></h2></div></div>
        <div class="cats" id="cats"></div>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="container">
        <div class="sec-head reveal"><div><span class="k" data-i18n="up.k"></span><h2 data-i18n="up.t"></h2><p data-i18n="up.p"></p></div><a class="btn ghost sm" href="events.html" data-i18n="all.events"></a></div>
        <div class="grid" id="upcoming"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="sec-head center reveal"><div><span class="k" data-i18n="how.k"></span><h2 data-i18n="how.t"></h2><p data-i18n="how.p"></p></div></div>
        <div class="steps">
          <div class="step reveal"><div class="ic">🔎</div><h3 data-i18n="how.1t"></h3><p data-i18n="how.1p"></p></div>
          <div class="step reveal"><div class="ic">🎟️</div><h3 data-i18n="how.2t"></h3><p data-i18n="how.2p"></p></div>
          <div class="step reveal"><div class="ic">🎉</div><h3 data-i18n="how.3t"></h3><p data-i18n="how.3p"></p></div>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="container stats">
        <div><b data-count="events">0</b><span data-i18n="stat.events"></span></div>
        <div><b data-count="cities">0</b><span data-i18n="stat.cities"></span></div>
        <div><b data-count="cats">0</b><span data-i18n="stat.cats"></span></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="cta-box reveal">
          <h2 data-i18n="cta.t"></h2><p data-i18n="cta.p"></p>
          <a class="btn gold" href="signup.html" data-i18n="signup"></a>
        </div>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="container center reveal">
        <div class="sec-head center"><div><h2 data-i18n="news.t"></h2><p data-i18n="news.p"></p></div></div>
        <form class="news" id="news" novalidate><input type="email" class="ltr" data-i18n-ph="news.ph" aria-label="Email" /><button class="btn" type="submit" data-i18n="news.btn"></button></form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
