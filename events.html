<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الفعاليات</title>
  <meta name="description" content="تصفّح الفعاليات وصفِّها حسب المدينة والنوع ثم احجز مقعدك" />
  <meta name="theme-color" content="#0f3d3e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-page="events" class="inner">
  <header id="site-header"></header>
  <main>
    <div class="page-head"><div class="container"><h1 data-i18n="events.t"></h1><p data-i18n="events.p"></p></div></div>
    <section style="padding-top:0">
      <div class="container">
        <div class="toolbar">
          <div class="tb-row">
            <div class="grow"><input id="f-q" type="search" data-i18n-ph="tb.search" aria-label="Search" autocomplete="off" /></div>
            <select id="f-sort" aria-label="Sort"></select>
          </div>
          <div class="chips" id="chips-cat"></div>
          <div class="chips" id="chips-city"></div>
        </div>
        <div class="count-bar"><b id="count"></b></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty"><b data-i18n="empty.t"></b><span data-i18n="empty.p"></span><br><button class="btn sm ghost" id="reset" style="margin-top:14px" data-i18n="reset"></button></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
