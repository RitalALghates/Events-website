<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الفعاليات</title>
  <meta name="description" content="سجّل دخولك لحجز تذاكرك" />
  <meta name="theme-color" content="#0f3d3e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-page="login" class="inner">
  <header id="site-header"></header>
  <main class="auth">
    <aside class="auth-side"><h2 data-i18n="side.t"></h2><p data-i18n="side.p"></p></aside>
    <div class="auth-main">
      <div class="auth-card">
        <h1 data-i18n="login.t"></h1><p class="sub" data-i18n="login.p"></p>
        <form id="auth-form" novalidate>
          <div class="fg"><label for="a-email" data-i18n="c.email"></label><input id="a-email" name="email" type="email" class="ltr" placeholder="name@example.com" autocomplete="email" /><div class="err"></div></div>
          <div class="fg"><label for="a-pw" data-i18n="pw"></label><div class="pw"><input id="a-pw" name="password" type="password" data-i18n-ph="pw.ph" autocomplete="current-password" /><button type="button" data-i18n="show"></button></div><div class="err"></div></div>
          <button class="btn full" type="submit" data-i18n="login.btn"></button>
        </form>
        <p class="alt"><span data-i18n="login.no"></span> <a href="signup.html?next=" id="alt-link" data-i18n="signup"></a></p>
        <p class="note" data-i18n="demo.note"></p>
      </div>
    </div>
  </main>
  <script>(function(){var n=new URLSearchParams(location.search).get("next");if(n){document.addEventListener("DOMContentLoaded",function(){var a=document.getElementById("alt-link");a.href=a.getAttribute("href").split("?")[0]+"?next="+encodeURIComponent(n);});}})();</script>
  <footer id="site-footer"></footer>
</body>
</html>
