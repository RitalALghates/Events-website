<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الفعاليات</title>
  <meta name="description" content="تواصل مع فريق منصة الفعاليات" />
  <meta name="theme-color" content="#0f3d3e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-page="contact" class="inner">
  <header id="site-header"></header>
  <main>
    <div class="page-head"><div class="container"><h1 data-i18n="contact.t"></h1><p data-i18n="contact.p"></p></div></div>
    <section>
      <div class="container contact-wrap">
        <div>
          <div class="info-card reveal"><span class="ic">✉️</span><div><b data-i18n="c.mail"></b><span class="ltr">events@platform.com</span></div></div>
          <div class="info-card reveal"><span class="ic">📍</span><div><b data-i18n="c.where"></b><span data-i18n="c.where.v"></span></div></div>
          <div class="info-card reveal"><span class="ic">🕘</span><div><b data-i18n="c.hours"></b><span data-i18n="c.hours.v"></span></div></div>
        </div>
        <div class="panel reveal">
          <form id="contact-form" novalidate>
            <div class="fg"><label for="c-name" data-i18n="c.name"></label><input id="c-name" name="name" data-i18n-ph="c.ph.name" autocomplete="name" /><div class="err"></div></div>
            <div class="fg"><label for="c-email" data-i18n="c.email"></label><input id="c-email" name="email" type="email" class="ltr" placeholder="name@example.com" autocomplete="email" /><div class="err"></div></div>
            <div class="fg"><label for="c-msg" data-i18n="c.msg"></label><textarea id="c-msg" name="message" data-i18n-ph="c.ph.msg"></textarea><div class="err"></div></div>
            <button class="btn full" type="submit" data-i18n="c.send"></button>
          </form>
        </div>
      </div>
    </section>
    <section style="padding-top:0">
      <div class="container">
        <div class="sec-head center reveal"><div><h2 data-i18n="faq.t"></h2></div></div>
        <div class="faq">
          <details class="reveal"><summary data-i18n="faq1q"></summary><p data-i18n="faq1a"></p></details>
          <details class="reveal"><summary data-i18n="faq2q"></summary><p data-i18n="faq2a"></p></details>
          <details class="reveal"><summary data-i18n="faq3q"></summary><p data-i18n="faq3a"></p></details>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
