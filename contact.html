
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="تواصل مع منصة الفعاليات للاستفسارات وحجز الفعاليات" />
    <meta name="keywords" content="تواصل, منصة الفعاليات, استفسارات, حجز فعاليات" />
    <title>تواصل - منصة الفعاليات</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <button class="back-to-top" aria-label="العودة إلى الأعلى"><i class="fas fa-chevron-up"></i></button>
    <header>
        <div class="logo">
            <h1 data-lang-ar="منصة الفعاليات" data-lang-en="Events Platform">منصة الفعاليات</h1>
        </div>
        <nav aria-label="التنقل الرئيسي">
            <ul>

                <li><a href="index.html"data-lang-ar="الرئيسية" data-lang-en="Home"  >الرئيسية</a> </li>
                <li><a href="events.html" data-lang-ar="الفعاليات" data-lang-en="Events">الفعاليات</a></li>
                <li><a href="about.html" data-lang-ar="حول" data-lang-en="About">حول</a></li>
                <li><a href="contact.html"  class="active" data-lang-ar="تواصل" data-lang-en="Contact" >تواصل</a></li>
                <li><a href="signup.html" data-lang-ar="إنشاء حساب" data-lang-en="Sign Up">إنشاء حساب</a></li>
                <li><a href="login.html" data-lang-ar="تسجيل الدخول" data-lang-en="Login">تسجيل الدخول</a></li>
            </ul>
            <div class="header-search">
                <input type="text" id="header-search" placeholder="ابحث..." aria-label="البحث في الموقع" data-lang-ar-placeholder="ابحث..." data-lang-en-placeholder="Search..." />
                <button class="btn-search" aria-label="بحث"><i class="fas fa-search"></i></button>
            </div>
            <!-- <div class="language-switcher">
                <select id="language-switcher" aria-label="اختيار اللغة">
                    <option value="ar">عربي</option>
                    <option value="en">English</option>
                </select>
            </div> -->
        </nav>
    </header>

    <main>
        <section id="contact-slider" class="slider-container" aria-label="سلايدر التواصل">
            <button class="pause-slider" aria-label="إيقاف السلايدر">⏸</button>
            <div class="slider">
                <div class="slide active">
                    <img src="https://siteupmarketing.com/wp-content/uploads/2024/06/contact-us.png" alt="دعوة للتواصل مع فريق منصة الفعاليات" loading="lazy" />
                    <div class="slide-caption">
                        <h2>تواصل معنا</h2>
                        <p>فريقنا جاهز للإجابة على استفساراتك!</p>
                        <button class="btn">أرسل رسالتك</button>
                    </div>
                </div>
                <div class="slide">
                    <img src="images/contact-event.webp" alt="مشاركة تجربة فعالية سابقة" loading="lazy" />
                    <div class="slide-caption">
                        <h2>شاركنا تجربتك</h2>
                        <p>ساعدنا لتحسين فعالياتنا بآرائك!</p>
                        <button class="btn">أرسل رسالتك</button>
                    </div>
                </div>
            </div>
            <button class="slider-control prev" aria-label="الشريحة السابقة"><i class="fas fa-chevron-right"></i></button>
            <button class="slider-control next" aria-label="الشريحة التالية"><i class="fas fa-chevron-left"></i></button>
            <div class="slider-dots" role="tablist"></div>
        </section>

        <section id="contact-form" class="container">
            <h2>أرسل رسالتك</h2>
            <form id="contact-form" aria-label="نموذج التواصل">
                <div class="form-group">
                    <label for="name">الاسم</label>
                    <input type="text" id="name" placeholder="أدخل اسمك" required aria-required="true" />
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required aria-required="true" />
                </div>
                <div class="form-group">
                    <label for="message">الرسالة</label>
                    <textarea id="message" placeholder="اكتب رسالتك هنا" required aria-required="true"></textarea>
                </div>
                <button type="submit" class="btn">إرسال</button>
                <p class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content container">
            <div class="footer-logo">
                <h2>منصة الفعاليات</h2>
            </div>
            <div class="footer-links">
                <a href="about.html">حول</a>
                <a href="contact.html">تواصل</a>
                <a href="terms.html">الشروط والأحكام</a>
            </div>
            <div class="footer-social">
                <a href="https://facebook.com" aria-label="فيسبوك"><i class="fab fa-facebook-f"></i></a>
                <a href="https://twitter.com" aria-label="تويتر"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com" aria-label="إنستغرام"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <p>© <script>document.write(new Date().getFullYear())</script> منصة الفعاليات - جميع الحقوق محفوظة</p>
    </footer>

    <script src="slider.js"></script>
</body>
</html>
