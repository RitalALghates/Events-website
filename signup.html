<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="إنشاء حساب في منصة الفعاليات" />
    <meta name="keywords" content="إنشاء حساب, منصة الفعاليات" />
    <title data-lang-ar="إنشاء حساب - منصة الفعاليات" data-lang-en="Sign Up - Events Platform">إنشاء حساب - منصة الفعاليات</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <div class="logo">
            <h1 data-lang-ar="منصة الفعاليات" data-lang-en="Events Platform">منصة الفعاليات</h1>
        </div>
        <nav aria-label="التنقل الرئيسي">
            <ul>
                <li><a href="index.html" data-lang-ar="الرئيسية" data-lang-en="Home">الرئيسية</a></li>
                <li><a href="events.html" data-lang-ar="الفعاليات" data-lang-en="Events">الفعاليات</a></li>
                <li><a href="about.html" data-lang-ar="حول" data-lang-en="About">حول</a></li>
                <li><a href="contact.html" data-lang-ar="تواصل" data-lang-en="Contact">تواصل</a></li>
                <li><a href="signup.html" class="active" data-lang-ar="إنشاء حساب" data-lang-en="Sign Up">إنشاء حساب</a></li>
                <li><a href="login.html" data-lang-ar="تسجيل الدخول" data-lang-en="Login">تسجيل الدخول</a></li>
            </ul>
            <div class="header-search">
                <input type="text" id="header-search" placeholder="ابحث..." aria-label="البحث في الموقع" data-lang-ar-placeholder="ابحث..." data-lang-en-placeholder="Search..." />
                <button class="btn-search" aria-label="بحث"><i class="fas fa-search"></i></button>
            </div>
            <div class="language-switcher">
                <select id="language-switcher" aria-label="اختيار اللغة">
                    <option value="ar">عربي</option>
                    <option value="en">English</option>
                </select>
            </div>
        </nav>
    </header>

    <main>
        <section id="auth-section" class="container">
            <div class="auth-container">
                <!-- نموذج إنشاء حساب -->
                <div class="auth-form">
                    <h2 data-lang-ar="إنشاء حساب" data-lang-en="Sign Up">إنشاء حساب</h2>
                    <form id="signup-form" aria-label="نموذج إنشاء حساب">
                        <div class="form-group">
                            <label for="signup-name" data-lang-ar="الاسم" data-lang-en="Name">الاسم</label>
                            <input type="text" id="signup-name" placeholder="أدخل اسمك" required aria-required="true" data-lang-ar-placeholder="أدخل اسمك" data-lang-en-placeholder="Enter your name" />
                        </div>
                        <div class="form-group">
                            <label for="signup-email" data-lang-ar="البريد الإلكتروني" data-lang-en="Email">البريد الإلكتروني</label>
                            <input type="email" id="signup-email" placeholder="أدخل بريدك الإلكتروني" required aria-required="true" data-lang-ar-placeholder="أدخل بريدك الإلكتروني" data-lang-en-placeholder="Enter your email" />
                        </div>
                        <div class="form-group">
                            <label for="signup-password" data-lang-ar="كلمة المرور" data-lang-en="Password">كلمة المرور</label>
                            <input type="password" id="signup-password" placeholder="أدخل كلمة المرور" required aria-required="true" data-lang-ar-placeholder="أدخل كلمة المرور" data-lang-en-placeholder="Enter your password" />
                        </div>
                        <button type="submit" class="btn" data-lang-ar="إنشاء حساب" data-lang-en="Sign Up">إنشاء حساب</button>
                        <p class="form-message" aria-live="polite"></p>
                    </form>
                    <p class="auth-link">
                        <span data-lang-ar="لديك حساب بالفعل؟" data-lang-en="Already have an account?"></span>
                        <a href="login.html" data-lang-ar="تسجيل الدخول" data-lang-en="Login">تسجيل الدخول</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content container">
            <div class="footer-logo">
                <h2 data-lang-ar="منصة الفعاليات" data-lang-en="Events Platform">منصة الفعاليات</h2>
            </div>
            <div class="footer-links">
                <a href="about.html" data-lang-ar="حول" data-lang-en="About">حول</a>
                <a href="contact.html" data-lang-ar="تواصل" data-lang-en="Contact">تواصل</a>
                <a href="terms.html" data-lang-ar="الشروط والأحكام" data-lang-en="Terms and Conditions">الشروط والأحكام</a>
            </div>
            <div class="footer-social">
                <a href="https://facebook.com" aria-label="فيسبوك"><i class="fab fa-facebook-f"></i></a>
                <a href="https://twitter.com" aria-label="تويتر"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com" aria-label="إنستغرام"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <p data-lang-ar="© 2025 منصة الفعاليات - جميع الحقوق محفوظة" data-lang-en="© 2025 Events Platform - All Rights Reserved">
            © <script>document.write(new Date().getFullYear())</script> منصة الفعاليات - جميع الحقوق محفوظة
        </p>
    </footer>

    <script src="slider.js"></script>
</body>
</html>
